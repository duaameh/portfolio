<section class="bg-[#173B44] text-white py-16">
  <div class="container mx-auto px-4" style="    padding-left: 17rem">
    <div class="flex flex-col lg:flex-row lg:center lg:items-start gap-8">
      
      <!-- Contact Info -->
      <div class="w-full lg:w-[34%]">
        <h2 class="text-2xl font-bold mb-2">Get in Touch</h2>
        <div class="h-1 w-12 bg-[#2bd8b2] mb-6"></div>

        <div class="flex items-start mb-4">
          <span class="text-[#2bd8b2] text-lg mr-3 mt-1">●</span>
          <div>
            <h4 class="font-semibold">Address</h4>
            <p class="text-sm">A108 Adam Street, New York, NY 535022</p>
          </div>
        </div>

        <div class="flex items-start mb-4">
          <span class="text-[#2bd8b2] text-lg mr-3 mt-1">●</span>
          <div>
            <h4 class="font-semibold">Call Us</h4>
            <p class="text-sm">+1 5589 55488 55</p>
          </div>
        </div>

        <div class="flex items-start">
          <span class="text-[#2bd8b2] text-lg mr-3 mt-1">●</span>
          <div>
            <h4 class="font-semibold">Email Us</h4>
            <p class="text-sm">info#64example.com</p>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="w-full lg:w-[48%]">
        <h2 class="text-2xl font-bold mb-2">Send Us a Message</h2>
        <div class="h-1 w-12 bg-[#2bd8b2] mb-6"></div>

        <form>
          <div class="mb-4">
            <label class="block mb-1 font-semibold">Your Name</label>
            <input type="text" class="w-full p-3 rounded text-black" placeholder="Enter your name" />
          </div>

          <div class="mb-4">
            <label class="block mb-1 font-semibold">Your Email</label>
            <input type="email" class="w-full p-3 rounded text-black" placeholder="Enter your email" />
          </div>

          <div class="mb-4">
            <label class="block mb-1 font-semibold">Subject</label>
            <input type="text" class="w-full p-3 rounded text-black" placeholder="Subject" />
          </div>

          <div class="mb-4">
            <label class="block mb-1 font-semibold">Message</label>
            <textarea class="w-full p-3 rounded text-black h-32" placeholder="Type your message..."></textarea>
          </div>

          <button type="submit" class="bg-[#2bd8b2] hover:bg-[#26b99a]
           text-white px-6 py-2 rounded font-semibold transition"
           style="    background-color: #0f2027">
            Send Message
          </button>
        </form>
      </div>

    </div>
  </div>
</section>
