<section class="contact" id="contact">
  <div class="container">
    <h2>Contact Me</h2>
    <form (ngSubmit)="onSubmit()" #contactForm="ngForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required [(ngModel)]="contact.name" #name="ngModel" />
        <div class="error" *ngIf="name.invalid && name.touched">Name is required</div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          email
          [(ngModel)]="contact.email"
          #email="ngModel"
        />
        <div class="error" *ngIf="email.invalid && email.touched">
          Please enter a valid email
        </div>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required rows="5" [(ngModel)]="contact.message" #message="ngModel"></textarea>
        <div class="error" *ngIf="message.invalid && message.touched">Message is required</div>
      </div>

      <button type="submit" [disabled]="contactForm.invalid" class="btn">Send Message</button>
    </form>

    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  </div>
</section>
